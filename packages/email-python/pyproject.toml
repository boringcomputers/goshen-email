[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bezalel-email"
version = "0.1.0"
description = "Bezalel Email account and mailbox API client"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
readme = "README.md"

[tool.setuptools.package-data]
bezalel_email = ["manifest.json", "py.typed"]
