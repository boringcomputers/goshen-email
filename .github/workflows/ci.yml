name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bezalel_email_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bezalel_email_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @bezalel/email exec tsx scripts/build-native.ts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bezalel_email_test
      - run: pnpm source:check
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: gate
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved past this commit. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check deploy credentials
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. Use the Edit Cloudflare Workers token template, scoped to this account."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy API Worker
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/email
        run: pnpm exec wrangler deploy --message "main ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy native Worker
        if: steps.gate.outputs.skip != 'true'
        run: pnpm --filter @bezalel/email exec tsx scripts/deploy-native.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy dashboard Worker
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/email-dashboard
        run: pnpm exec wrangler deploy --message "main ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
