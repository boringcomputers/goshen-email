name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bezalel_email_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bezalel_email_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @bezalel/email exec wrangler deploy --config wrangler.native.jsonc --dry-run --outdir dist/native
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bezalel_email_test
      - run: pnpm source:check
